<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <title>Space Invaders</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <h1>Space Invaders</h1>

    <section id="menu">
        <!-- Il for collega la label all'input -->
        <label for="inputnome">Inserisci il nome</label>
        <input type="text" name="nome" id="inputnome" placeholder="insursore speciale"><br>

        <label for="difficoltà">Difficoltà</label>
        <select name="difficoltà" id="difficoltà">
            <option value="facile">facile</option>
            <option value="difficile">difficile</option>
            <option value="superdifficile">superdifficile</option>
        </select><br>

        <button id="start">Start</button><br>
    </section>


    <section id="partita" class="nascosto">

        <div id="pannello">
            <span id="punteggio">Punteggio: 0</span>
            <span id="vite"></span>
        </div>

        <div class="area-gioco"></div>

        <p id="messaggio"></p>
    </section>

    
    <section id="classifica">
        <h2>Classifica</h2>
        <p id="statoClassifica"></p>
        <ul id="listaClassifica"></ul>
        <button id="rigioca" class="nascosto">Rigioca</button>
    </section>

    <script src="script.js"></script>
</body>
</html>
